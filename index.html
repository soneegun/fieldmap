<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>필드맛지도</title>
<meta name="description" content="필드워크로 낯선 지역에 간 팀이 동료 후기와 팀 조건으로 식사 장소를 빠르게 고르는 앱">
<meta name="theme-color" content="#FFE9DF">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath d='M32 4C20 4 11 13 11 25c0 16 21 35 21 35s21-19 21-35C53 13 44 4 32 4z' fill='%23FD5108'/%3E%3Cpath d='M26 15v9a4 4 0 0 0 4 4v8M30 15v8M34 15v9a4 4 0 0 1-4 4M40 15c-3 2-3 9 0 11v10' stroke='%23fff' stroke-width='3' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="https://hangeul.pstatic.net/hangeul_static/css/nanum-square-round.css">
<link rel="stylesheet" href="lib/leaflet.css">
<style>
/* 레이아웃: 모바일 앱 한 열(최대 480px). 상단은 복숭아빛 그라데이션 + 물결, 본문은 따뜻한 흰색. */
:root{
  --o900:#FD5108;   /* 포인트(로고의 진한 주황) — 메인 버튼, 선택 상태, 핀 */
  --o800:#E24600;   /* 눌림 */
  --o-ink:#C23A00;  /* 흰 배경 위 주황 글자 */
  --o100:#FFE5D8;   /* 선택된 칩, 추천 이유 바 */
  --o50:#FFF3EC;    /* 입력창, 배지, 섹션 배경 */
  --peach1:#FFD2BF; --peach2:#FFE7E5; --peach3:#FFF6F2;
  --bg:#FFFBF8; --surface:#FFFFFF;
  --t900:#141414; --t600:#5E5753; --t400:#9A918C;
  --line:#F0E4DC; --disabled:#FFBFA3; --star:#F2B01E; --error:#D92D20; --ok:#1F8A5B;
  --f-body:"Pretendard",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-title:"NanumSquareRound","Pretendard",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --tabh:64px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:linear-gradient(160deg,var(--peach2),var(--bg) 40%);color:var(--t900);font-family:var(--f-body);font-size:14px;line-height:1.5;letter-spacing:-.01em;-webkit-font-smoothing:antialiased;color-scheme:light}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--o900);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
[hidden]{display:none!important}
#app{max-width:480px;margin:0 auto;min-height:100%;background:var(--bg);position:relative;box-shadow:0 0 40px rgba(253,81,8,.08)}
.scr{min-height:100vh;padding-bottom:calc(var(--tabh) + 110px)}
.scr.notab{padding-bottom:110px}
.t-title{font-family:var(--f-title);font-weight:800;letter-spacing:-.03em;line-height:1.3}
h1,h2,h3{margin:0}

/* 그라데이션 히어로 + 물결 */
.hero{position:relative;background:
  radial-gradient(110% 90% at 100% 0%,var(--peach1) 0%,rgba(255,210,191,0) 62%),
  radial-gradient(90% 80% at 0% 0%,var(--peach2) 0%,rgba(255,231,229,0) 60%),
  linear-gradient(180deg,#FFEDE5 0%,var(--peach3) 100%);
  padding:16px 16px 56px;overflow:hidden}
.wave{position:absolute;left:0;right:0;bottom:-1px;width:100%;height:48px;display:block}
.wave path{fill:var(--bg)}
.logo{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-title);font-weight:800;font-size:17px;letter-spacing:-.03em;color:var(--t900);text-decoration:none;border:0;background:none;padding:0}
.logo svg{width:24px;height:24px}
.topline{display:flex;align-items:center;justify-content:space-between;min-height:44px}
.iconbtn{width:44px;height:44px;display:grid;place-items:center;border:0;background:none;border-radius:12px;color:var(--t900);position:relative}
.iconbtn svg{width:24px;height:24px}
.iconbtn .dot{position:absolute;top:6px;right:5px;min-width:16px;height:16px;border-radius:8px;background:var(--o900);color:#fff;font-size:10px;font-weight:800;display:grid;place-items:center;padding:0 4px}
.ic{fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}

/* 로그인 */
.auth-hero{height:40vh;min-height:260px;max-height:340px;padding-bottom:0}
.auth-hero .illu{position:absolute;left:50%;bottom:30px;transform:translateX(-50%);width:260px;max-width:72%}
.auth-body{padding:4px 24px 32px;display:grid;gap:14px}
.auth-head{text-align:center;position:relative;margin-bottom:10px}
.auth-head h1{font-size:26px;color:var(--o-ink)}
.auth-head p{margin:6px 0 0;color:var(--t400)}
.auth-head .deco{position:absolute;right:0;top:-38px;width:28px;height:28px;transform:rotate(-12deg);color:var(--o800)}
.field{position:relative;display:flex;align-items:center;gap:12px;height:52px;border-radius:14px;background:var(--o50);padding:0 14px;border:1.5px solid transparent;transition:background .2s,border-color .2s}
.field:focus-within{background:var(--o100);border-color:var(--o900)}
.field.err{border-color:var(--error)}
.field>svg{width:20px;height:20px;color:var(--o900);flex:none}
.field input,.field select{flex:1;min-width:0;border:0;background:none;outline:none;height:100%;font-size:15px;font-weight:600;color:var(--t900);appearance:none;-webkit-appearance:none}
.field select:invalid{color:var(--t400);font-weight:400}
.field input::placeholder{color:var(--t400);font-weight:400}
.field .eye{border:0;background:none;width:36px;height:36px;display:grid;place-items:center;color:var(--t600);margin-right:-8px}
.field .eye svg{width:20px;height:20px}
.field .okc{width:20px;height:20px;color:var(--ok)}
.msg{font-size:12px;font-weight:600;margin:-6px 4px 0;min-height:0}
.msg.e{color:var(--error)} .msg.o{color:var(--ok)} .msg.n{color:var(--t400);font-weight:400}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:54px;border:0;border-radius:999px;background:var(--o900);color:#fff;font-weight:800;font-size:16px;box-shadow:0 8px 20px rgba(253,81,8,.25);transition:background .2s,box-shadow .2s}
.btn:active{background:var(--o800)}
.btn:disabled{background:var(--disabled);box-shadow:none;cursor:not-allowed}
.btn2{display:flex;align-items:center;justify-content:center;height:52px;border-radius:999px;border:1px solid var(--o900);background:var(--surface);color:var(--o-ink);font-weight:800;font-size:15px;width:100%}
.btn2:active{background:var(--o50)}
.tbtn{border:0;background:none;color:var(--o-ink);font-weight:600;font-size:14px;padding:10px 4px;min-height:44px}
.authlink{text-align:center;color:var(--t400);margin-top:4px}
.authlink button{border:0;background:none;color:var(--o-ink);font-weight:800;text-decoration:underline;padding:10px 4px}

/* 홈 */
.home-hero{padding-bottom:84px}
.home-hero h1{font-size:28px;margin-top:14px}
.home-hero p{margin:6px 0 0;color:var(--t600);max-width:62%}
.home-hero .illu{position:absolute;right:6px;bottom:44px;width:132px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px}
.search-card{margin:-56px 16px 0;position:relative;z-index:3;border-radius:20px;border:0;box-shadow:0 10px 30px rgba(253,81,8,.13);padding:18px 16px 12px}
.qhead{display:flex;align-items:center;gap:6px;font-weight:800;font-size:16px;margin-bottom:10px}
.qhead svg{width:20px;height:20px;color:var(--o900)}
.sugg{margin-top:6px;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff}
.sugg button{display:flex;width:100%;align-items:center;gap:10px;border:0;background:none;padding:12px 14px;text-align:left;min-height:44px}
.sugg button+button{border-top:1px solid var(--line)}
.sugg small{color:var(--t400);margin-left:auto}
.sec{padding:22px 16px 0}
.sitgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.sit{display:grid;justify-items:center;gap:4px;padding:10px 2px;border-radius:14px;border:1px solid var(--line);background:var(--surface);color:var(--t600);font-weight:600;font-size:13px;min-height:68px;white-space:nowrap}
.sit svg{width:22px;height:22px}
.sit.on{background:var(--o100);border-color:var(--o100);color:var(--o-ink)}
.dd3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.dd label{display:block;font-size:12px;color:var(--t600);font-weight:600;margin:0 0 6px 4px}
.sel{position:relative}
.sel select{width:100%;height:48px;border-radius:14px;border:0;background:var(--o50);padding:0 30px 0 12px;font-weight:600;font-size:14px;appearance:none;-webkit-appearance:none}
.sel:after{content:"";position:absolute;right:13px;top:50%;width:7px;height:7px;border-right:1.75px solid var(--t600);border-bottom:1.75px solid var(--t600);transform:translateY(-70%) rotate(45deg);pointer-events:none}
.morerow{display:flex;align-items:center;gap:12px;width:100%;margin-top:12px;border:1px solid var(--line);border-radius:14px;background:var(--surface);padding:12px 14px;text-align:left;min-height:56px}
.morerow svg{width:22px;height:22px;color:var(--o900);flex:none}
.morerow b{display:block;font-size:14px}
.morerow small{color:var(--t400)}
.morerow .cnt{margin-left:auto;background:var(--o900);color:#fff;border-radius:999px;font-size:12px;font-weight:800;padding:2px 8px}
.morerow .chev{margin-left:auto;width:18px;height:18px;color:var(--t400)}
.morerow .cnt+.chev{margin-left:0}
.pills{display:flex;gap:8px;flex-wrap:wrap}
.pillchip{display:inline-flex;align-items:center;gap:6px;border:0;border-radius:999px;background:var(--o50);color:var(--t900);font-weight:600;padding:8px 14px;min-height:40px}
.pillchip svg{width:16px;height:16px;color:var(--o900)}
.invite{display:flex;align-items:center;gap:12px;margin:22px 16px 0;padding:14px;border-radius:14px;background:var(--o50)}
.invite .b{width:40px;height:40px;border-radius:50%;background:#fff;display:grid;place-items:center;flex:none;color:var(--o900)}
.invite .b svg{width:20px;height:20px}
.invite p{margin:0;font-size:13px;color:var(--t600);flex:1}
.invite p b{display:block;color:var(--t900);font-size:14px}
.cta{position:fixed;left:0;right:0;bottom:calc(var(--tabh) + env(safe-area-inset-bottom,0px));z-index:40;padding:10px 16px 12px;pointer-events:none}
.cta.notab{bottom:0;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px))}
.cta>div{max-width:448px;margin:0 auto;pointer-events:auto}
.cta .cap{text-align:center;font-size:12px;color:var(--t600);margin-bottom:6px;background:rgba(255,251,248,.9);border-radius:8px}
.cta:before{content:"";position:absolute;inset:0;background:linear-gradient(to top,var(--bg) 60%,rgba(255,251,248,0));z-index:-1}

/* 하단 탭 */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:50;background:rgba(255,255,255,.97);backdrop-filter:blur(10px);box-shadow:0 -1px 0 var(--line),0 -4px 14px rgba(0,0,0,.04);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar>div{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);height:var(--tabh)}
.tabbar button{border:0;background:none;display:grid;justify-items:center;align-content:center;gap:3px;color:var(--t400);font-size:12px;font-weight:600}
.tabbar svg{width:24px;height:24px}
.tabbar button.on{color:var(--o-ink)}

/* 상단 바 (하위 화면) */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;display:grid;grid-template-columns:44px 1fr 88px;align-items:center;padding:4px 8px;background:rgba(255,251,248,.96);backdrop-filter:blur(8px)}
.bar .logo{justify-self:center;font-size:16px}
.bar .r{display:flex;justify-content:flex-end}
.bar.plain{grid-template-columns:44px 1fr 44px}
.bar h1{text-align:center;font-size:18px}

/* 목록 */
.regionbar{display:flex;align-items:center;gap:8px;margin:4px 16px 0;padding:6px 6px 6px 14px;border-radius:999px;background:var(--o50)}
.regionbar svg{width:18px;height:18px;color:var(--o900);flex:none}
.regionbar b{font-size:15px}
.regionbar .tbtn{margin-left:auto;padding:6px 10px;min-height:40px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;margin:12px 16px 0;padding:4px;border-radius:999px;background:var(--o50)}
.seg button{border:0;border-radius:999px;background:none;height:40px;font-weight:800;color:var(--t600)}
.seg button.on{background:var(--o900);color:#fff}
.chiprow{position:relative;margin-top:12px}
.chiprow .scroll{display:flex;gap:6px;overflow-x:auto;padding:0 40px 2px 16px;scrollbar-width:none}
.chiprow .scroll::-webkit-scrollbar{display:none}
.chiprow:after{content:"";position:absolute;right:0;top:0;bottom:0;width:40px;background:linear-gradient(to right,rgba(255,251,248,0),var(--bg));pointer-events:none}
.fchip{flex:none;display:inline-flex;align-items:center;gap:5px;border:0;border-radius:999px;background:var(--o100);color:var(--o-ink);font-weight:600;font-size:13px;padding:0 12px;height:36px;white-space:nowrap}
.fchip.f{background:var(--surface);color:var(--t900);border:1px solid var(--line)}
.fchip svg{width:16px;height:16px}
.reshead{display:flex;align-items:center;gap:8px;margin:16px 16px 0}
.reshead h2{font-size:17px;flex:1}
.reshead .sel select{height:38px;background:var(--surface);border:1px solid var(--line);font-size:13px;padding-right:28px}
.caption{display:flex;align-items:center;gap:5px;margin:6px 16px 0;font-size:12px;color:var(--t400)}
.caption svg{width:14px;height:14px;flex:none}
.list{display:grid;gap:12px;padding:12px 16px 0}
.rc{display:grid;grid-template-columns:104px 1fr;gap:14px;padding:16px;cursor:pointer;text-align:left;width:100%;position:relative}
.rc:hover{border-color:#F3CDBB}
.ph{width:104px;height:104px;border-radius:12px;overflow:hidden;background:linear-gradient(145deg,var(--o50),var(--peach1));display:grid;place-items:center;color:var(--o-ink);font-weight:800;font-size:13px;position:relative}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph span{opacity:.75}
.rc .info{min-width:0;display:grid;gap:2px;align-content:start}
.rc .nm{display:flex;align-items:center;gap:6px;padding-right:34px}
.rc .nm b{font-size:16px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ex{flex:none;font-size:11px;color:var(--t600);background:#F4F0ED;border-radius:999px;padding:1px 7px;font-weight:600}
.sub{color:var(--t600);font-size:13px}
.rate{display:flex;align-items:center;gap:4px;font-size:13px;font-weight:600}
.rate svg{width:14px;height:14px;fill:var(--star)}
.badges{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.bdg{font-size:12px;border-radius:999px;background:var(--o50);color:var(--t900);padding:2px 9px;font-weight:600}
.bdg.g{background:#F4F0ED;color:var(--t600);font-weight:400}
.why{grid-column:1 / -1;display:flex;align-items:center;gap:6px;height:32px;border-radius:8px;background:var(--o100);color:var(--o-ink);font-size:12px;font-weight:600;padding:0 10px;white-space:nowrap;overflow:hidden}
.why svg{width:14px;height:14px;flex:none}
.waitline{grid-column:1 / -1;display:flex;align-items:center;gap:5px;font-size:12px;color:var(--t600);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:-6px}
.waitline svg{width:14px;height:14px;flex:none;color:var(--t400)}
.waitline span{overflow:hidden;text-overflow:ellipsis}
.rc .acts{position:absolute;top:40px;right:8px;display:flex}
/* 감사의견: 목록 카드 상단 띠 */
.aud{grid-column:1 / -1;display:flex;align-items:center;gap:8px;height:32px;margin:-16px -16px 0;padding:0 14px;font-size:12px;font-weight:600;border-bottom:1px solid;border-radius:11px 11px 0 0;white-space:nowrap;overflow:hidden}
.aud b{flex:none;font-size:11px;font-weight:800;border:1.5px solid currentColor;border-radius:6px;padding:0 6px;line-height:18px;background:#fff}
.aud span{overflow:hidden;text-overflow:ellipsis}
.aud.ok{color:#1F8A5B;background:#E8F5EE;border-color:#CBE8D8}
.aud.qu{color:#B54708;background:#FFF4E5;border-color:#F5DDBB}
.aud.ad{color:#D92D20;background:#FEECEB;border-color:#F8CFCB}
.aud.di{color:#5E5753;background:#F2EEEB;border-color:#E2DAD4}
/* 감사의견: 상세 도장 */
.audbox .srow{display:flex;align-items:center;gap:16px}
.stamp{flex:none;width:76px;height:76px;border-radius:50%;border:4px double currentColor;display:grid;place-items:center;font-family:var(--f-title);font-weight:800;font-size:18px;letter-spacing:-.04em;transform:rotate(-9deg)}
.stamp.sm{font-size:13px}
.stamp.ok{color:#1F8A5B;background:#E8F5EE}
.stamp.qu{color:#B54708;background:#FFF4E5}
.stamp.ad{color:#D92D20;background:#FEECEB}
.stamp.di{color:#5E5753;background:#F2EEEB}
.audbox .smsg b{display:block;font-size:15px;font-weight:800}
.audbox .smsg small{display:block;font-size:13px;color:var(--t600);margin-top:2px}
.audrows{margin-top:14px;border-top:1px solid var(--line);padding-top:8px;display:grid;gap:6px;font-size:13px}
.audrows div{display:flex;justify-content:space-between;gap:8px}
.audrows span:first-child{color:var(--t600)}
.audrows .y{color:#1F8A5B;font-weight:700}
.audrows .w{color:#B54708;font-weight:700}
.audrows .n{color:#D92D20;font-weight:700}
.audnote{margin:10px 0 0;font-size:12px;color:var(--t400)}
.save svg{width:22px;height:22px}
.save.on svg{fill:var(--o900);stroke:var(--o900)}
.empty{text-align:center;padding:36px 20px;display:grid;gap:14px;justify-items:center}
.empty p{margin:0;color:var(--t600);font-size:15px;max-width:300px}
.empty .btn{max-width:280px}
#map{height:calc(100vh - 520px);min-height:260px;margin:12px 16px 0;border-radius:16px;overflow:hidden;border:1px solid var(--line);background:#F6EEE9}
.pin{transform:translate(-50%,-100%);display:inline-flex;flex-direction:column;align-items:center}
.pin b{min-width:26px;height:26px;border-radius:13px;padding:0 7px;background:#fff;color:var(--o-ink);border:2px solid var(--o900);display:grid;place-items:center;font-size:12px;font-weight:800;box-shadow:0 2px 6px rgba(0,0,0,.18);white-space:nowrap}
.pin.top b,.pin.on b{background:var(--o900);color:#fff}
.pin i{width:2px;height:6px;background:var(--o900)}
.office{transform:translate(-50%,-50%);display:inline-block;background:var(--t900);color:#fff;font-weight:800;font-size:12px;border-radius:999px;padding:4px 10px;white-space:nowrap;box-shadow:0 2px 6px rgba(0,0,0,.25)}
.leaflet-div-icon{background:none;border:0}
.mapcard{padding:12px 16px 0}
.mapcard>.card{box-shadow:0 8px 24px rgba(0,0,0,.08)}
.leaflet-tile-pane{filter:saturate(.75) sepia(.06) brightness(1.03)}
.tilewarn{position:absolute;left:52px;right:8px;top:8px;z-index:500;background:rgba(255,255,255,.95);border-radius:8px;padding:6px 10px;font-size:12px;color:var(--t600)}

/* 상세 */
.dhero{height:220px;margin:0;background:linear-gradient(145deg,var(--o50),var(--peach1));display:grid;place-items:center;color:var(--o-ink);font-weight:800;overflow:hidden}
.dhero img{width:100%;height:100%;object-fit:cover}
.dhead{padding:16px 16px 0;display:grid;gap:4px}
.dhead .nm{display:flex;align-items:center;gap:8px}
.dhead h1{font-size:22px}
.dhead .meta{display:flex;align-items:center;gap:6px;flex-wrap:wrap;color:var(--t600);font-size:13px}
.dhead .meta .sep{width:1px;height:12px;background:var(--line)}
.dhead .meta svg{width:14px;height:14px}
.dacts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:16px 16px 0}
.dacts button{display:grid;justify-items:center;gap:4px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 0;font-size:12px;font-weight:600;color:var(--t900);min-height:64px}
.dacts svg{width:22px;height:22px;color:var(--t600)}

.mrow{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px dashed var(--line);font-size:14px}

.rv{padding:12px 0;border-top:1px solid var(--line)}

.rv .h{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--t600);flex-wrap:wrap}

.rv .s{display:flex;align-items:center;gap:8px;margin-top:2px;font-size:13px;font-weight:600}
.rv .s .st{display:flex}
.rv .s .st svg{width:14px;height:14px;fill:var(--star)}
.rv .s .st svg.off{fill:#E9E1DB}
.rv p{margin:6px 0 0;font-size:14px}
.mine{font-size:11px;background:var(--o100);color:var(--o-ink);border-radius:999px;padding:0 7px;font-weight:800}

/* 후기 쓰기 */
.form{display:grid;gap:20px;padding:8px 16px 0}
.form .q{font-size:14px;font-weight:600;margin-bottom:8px}

.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:0 16px;height:44px;font-weight:600;color:var(--t600)}
.chip.on{background:var(--o100);border-color:var(--o100);color:var(--o-ink)}

.stars{display:flex;gap:4px}

/* 시트 · 다이얼로그 · 토스트 */

<script>
(function(){

const REGIONS = Object.keys(D.anchors);
const ALIAS = {'여의도 IFC':['여의도','IFC','국제금융','여의나루'], '마곡 연구단지':['마곡','연구단지','강서','마곡나루'], '판교 테크노밸리':['판교','테크노','분당','성남'], '을지로 센터원':['을지로','센터원','중구','시청','종로']};
const COMPANIES = ['가온회계법인(예시)','누리회계법인(예시)','다솜컨설팅(예시)','라온세무법인(예시)'];
const PRICE_ASOF = '2026.10.01';

/* ---------- 아이콘 ---------- */
const I = {

  locate:'<svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r="7.5"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2"/></svg>',

const SIT_ICON = {'빠른 점심':I.clock,'팀 식사':I.people,'고객사 동반':I.brief,'회식':I.glass};
const WAVE = '<svg class="wave" viewBox="0 0 400 48" preserveAspectRatio="none" aria-hidden="true"><path d="M0 30 C70 6 140 6 205 24 C270 42 335 44 400 20 L400 48 L0 48 Z"/></svg>';
const LOGO = `<span class="logo">${I.fork}필드맛지도</span>`;

/* 미니 지도 일러스트 (평면 아이소메트릭) */
function illu(){
  return `<svg class="illu" viewBox="0 0 260 170" aria-hidden="true">

    <path d="M10 92 L130 154 L130 162 L10 100 Z" fill="#FFD9C6"/><path d="M130 154 L250 92 L250 100 L130 162 Z" fill="#FFC4A8"/>
    <path d="M52 70 L178 135 M88 52 L214 117" stroke="#fff" stroke-width="10" stroke-linecap="round"/>
    <path d="M40 106 L160 44 M100 136 L218 76" stroke="#fff" stroke-width="8" stroke-linecap="round"/>
    <g><path d="M150 58 L176 71 L176 41 L150 28 Z" fill="#FFC4A8"/><path d="M176 71 L196 61 L196 31 L176 41 Z" fill="#FFAE88"/><path d="M150 28 L170 18 L196 31 L176 41 Z" fill="#FFE5D8"/>
      <path d="M156 40 l6 3 M156 48 l6 3 M164 44 l6 3 M164 52 l6 3" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/></g>

    <g><path d="M184 112 L200 120 L200 106 L184 98 Z" fill="#FFC4A8"/><path d="M200 120 L214 113 L214 99 L200 106 Z" fill="#FFAE88"/><path d="M184 98 L198 91 L214 99 L200 106 Z" fill="#FFE5D8"/></g>
    <circle cx="120" cy="72" r="9" fill="#FFAE88"/><rect x="119" y="78" width="2.4" height="8" rx="1" fill="#E89A72"/>

    <path d="M146 112 C150 100 160 98 168 104" stroke="#FD5108" stroke-width="2.4" stroke-dasharray="3 5" fill="none" stroke-linecap="round"/>
    <g transform="translate(118 74)"><path d="M14 0C6 0 0 6 0 14c0 10 14 22 14 22s14-12 14-22C28 6 22 0 14 0z" fill="#FD5108"/><path d="M10 7v6a2.5 2.5 0 0 0 2.5 2.5v6M12.5 7v5M15 7v6a2.5 2.5 0 0 1-2.5 2.5M19 7c-2 1.5-2 6 0 7.5v6.5" stroke="#fff" stroke-width="1.8" fill="none" stroke-linecap="round"/></g>

    <g transform="translate(70 58)"><path d="M6 0C2.7 0 0 2.7 0 6c0 4.3 6 9.5 6 9.5s6-5.2 6-9.5C12 2.7 9.3 0 6 0z" fill="#FF8A5B"/><circle cx="6" cy="6" r="2.2" fill="#fff"/></g>

}

/* ---------- 저장소 ---------- */
const store = {
  get(k,d){ try{ const v = localStorage.getItem('fmv2_'+k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
  set(k,v){ try{ localStorage.setItem('fmv2_'+k, JSON.stringify(v)); }catch(e){} }
};
function hash(s){ let h = 2166136261; for (const c of s){ h ^= c.codePointAt(0); h = Math.imul(h, 16777619); } return (h>>>0).toString(16); }
// 시연용 기본 계정과 기존 별칭 (모두 가상)
let users = store.get('users', null);
if (!users){
  users = [{company:COMPANIES[0], nick:'필드맛지도', pw:hash('test1234')}];
  const nicks = [...new Set(R.flatMap(r => r.reviews.map(v => v.nick)))];
  nicks.forEach(n => users.push({company:COMPANIES[0], nick:n, pw:hash('seed-'+n)}));
  store.set('users', users);
}
let session = store.get('session', null);
let saved = store.get('saved', {});          // {별칭키: [id]}
let myReviews = store.get('reviews', {});    // {식당id: [후기]}
let recent = store.get('recent', []);
const ukey = () => session ? session.company + '/' + session.nick : '_';
const mySaved = () => saved[ukey()] || [];

const Q = Object.assign({region:null, sit:'빠른 점심', people:'3~4', price:'all', walk:'all', cuisine:'all', wait:'all', extras:[]}, store.get('query', {}));
if (Q.region && !REGIONS.includes(Q.region)) Q.region = null;
let sortBy = 'match', listView = 'list';

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const won = n => Number(n).toLocaleString('ko-KR') + '원';
const dot = d => String(d).replace(/-/g, '.');
const md = d => dot(d).slice(5);

/* ---------- 조건 · 필터 ---------- */
const PEOPLE = [['2','2명',2],['3~4','3~4명',4],['5~6','5~6명',6],['7+','7명 이상',7]];
const PRICE = [['all','전체'],['1만원 이하','1만 원 미만'],['1만~2만원','1만~2만 원'],['2만원 이상','2만 원 이상']];
const WALK = [['all','전체'],['5','5분 이내'],['10','10분 이내'],['15','15분 이내']];
const CUISINE = ['all','한식','일식','중식','양식','분식','고기'];
const WAIT = [['all','상관없음'],['0','바로 입장'],['10','10분 이내'],['20','20분 이내']];
const EXTRAS = [['reservation','예약 가능'],['parking','주차 가능'],['groupSeat','단체석 있음']];
const need = () => PEOPLE.find(p => p[0]===Q.people)[2];

function reviewsOf(r){ return [...(myReviews[r.id]||[]), ...r.reviews].sort((a,b) => b.date.localeCompare(a.date)); }
function ratingOf(r){ const v = reviewsOf(r); return v.reduce((s,x)=>s+Number(x.rating),0)/v.length; }
/* 감사의견: 동료 후기 기준 판정 (재미 요소) */
function opinionOf(r){
  const n = reviewsOf(r).length;
  if (n < 2) return {k:'di', t:'의견거절', tag:'근거 부족', msg:'후기가 부족해 판단할 수 없어요', sub:'후기가 2건 이상 쌓이면 의견을 낼게요.'};
  const avg = ratingOf(r), w = waitOf(r);
  if (avg < 3) return {k:'ad', t:'부적정', tag:'', msg:'동료 평가가 낮아요', sub:'평균 별점이 3.0 미만이에요.'};
  if (w.avg >= 15) return {k:'qu', t:'한정', tag:'대기 제외', msg:'대기시간을 제외하면 적정해요', sub:`${w.lunch?'점심 ':''}평균 대기가 ${w.avg}분이라 빠른 점심엔 아쉬워요.`};
  if (avg < 4) return {k:'qu', t:'한정', tag:'평가 보통', msg:'무난하지만 평가가 보통이에요', sub:'평균 별점이 4.0에 조금 못 미쳐요.'};
  return {k:'ok', t:'적정', tag:'', msg:'팀 식사 조건을 모두 충족해요', sub:'동료 평가가 좋고 대기도 짧아요.'};
}
function waitOf(r){ const v = reviewsOf(r); const l = v.filter(x=>x.slot==='점심'); const use = l.length ? l : v; return {avg: Math.round(use.reduce((s,x)=>s+Number(x.wait),0)/use.length), lunch: !!l.length, n: v.length, last: v[0].date}; }

function matches(r, q){
  const p = PEOPLE.find(x => x[0]===q.people)[2];
  return r.region===q.region
    && (!q.sit || r.situations.includes(q.sit))
    && r.maxPeople >= p
    && (q.price==='all' || r.priceBand===q.price)
    && (q.walk==='all' || r.walk <= +q.walk)
    && (q.cuisine==='all' || r.cuisine===q.cuisine)
    && (q.wait==='all' || r.wait <= +q.wait)
    && q.extras.every(e => r[e]);
}
const results = () => R.filter(r => matches(r, Q));
function score(r){ return ratingOf(r)*20 + Math.min(r.likes,40)*.4 - r.wait*.5 - r.walk*.7 + (r.situations[0]===Q.sit ? 4 : 0); }
function sorted(list){
  const f = {match:(a,b)=>score(b)-score(a), near:(a,b)=>a.walk-b.walk, rating:(a,b)=>ratingOf(b)-ratingOf(a)}[sortBy];
  return [...list].sort(f);
}
function reason(r){
  if (Q.sit==='빠른 점심' && r.wait<=5) return r.wait===0 ? '바로 입장할 수 있어 빠른 점심에 맞아요' : '대기가 짧아 빠른 점심에 맞아요';
  if (Q.sit==='고객사 동반' && r.room) return '룸이 있어 고객사와 조용히 식사하기 좋아요';
  if (Q.sit==='회식' && r.groupSeat) return `${r.maxPeople}명까지 앉을 수 있어 회식에 맞아요`;
  if (Q.sit==='팀 식사' && r.groupSeat) return '단체석이 있어 팀이 함께 앉기 좋아요';
  if (Q.price!=='all' && Q.walk!=='all') return '도보 이동과 가격 조건에 맞아요';
  if (Q.price!=='all') return '선택한 가격대와 인원 조건에 맞아요';
  if (Q.walk!=='all') return '도보 이동과 인원 조건에 맞아요';
  return `${need()}명 이상 함께 앉을 수 있어요`;
}
function persistQ(){ store.set('query', Q); }

/* 조건 시트: 홈에서는 추가 조건만, 목록에서는 전체 조건 */
function filterSheet(full){
  const T = JSON.parse(JSON.stringify(Q));
  const grp = (q, html) => `<div class="grp"><div class="q">${q}</div>${html}</div>`;
  const chipset = (key, opts, multi) => `<div class="chips">${opts.map(([v,l]) => `<button class="chip" data-k="${key}" data-v="${esc(v)}" ${multi?'data-multi="1"':''}>${l}</button>`).join('')}</div>`;
  openLayer(`<div class="ov" id="ov"><div class="sheet" role="dialog" aria-modal="true" aria-label="조건 선택">
    <div class="grab"></div><h2 class="t-title">${full?'조건 변경':'조건 더 보기'}</h2>
    ${full ? grp('식사 상황', chipset('sit', ['빠른 점심','팀 식사','고객사 동반','회식'].map(s=>[s,s]))) + grp('인원', chipset('people', PEOPLE.map(p=>[p[0],p[1]]))) + grp('1인 가격대', chipset('price', PRICE)) + grp('도보 이동시간', chipset('walk', WALK)) : ''}
    ${grp('음식 종류', chipset('cuisine', CUISINE.map(c=>[c, c==='all'?'전체':c])))}
    ${grp('대기시간', chipset('wait', WAIT))}
    ${grp('예약·주차·단체석', chipset('extras', EXTRAS, true))}
    <div class="foot"><button class="btn2" id="reset">초기화</button><button class="btn" id="apply"></button></div>
  </div></div>`);
  const paint = () => {
    document.querySelectorAll('.sheet [data-k]').forEach(b => {
      const k = b.dataset.k, v = b.dataset.v;
      const on = b.dataset.multi ? T.extras.includes(v) : String(T[k])===v;
      b.classList.toggle('on', on); b.setAttribute('aria-pressed', on);
    });
    const n = full ? R.filter(r => matches(r, T)).length : null;
    $('#apply').textContent = full ? `조건 적용하기 (${n}곳)` : '조건 적용하기';
  };
  document.querySelectorAll('.sheet [data-k]').forEach(b => b.onclick = () => {
    const k = b.dataset.k, v = b.dataset.v;
    if (b.dataset.multi) T.extras = T.extras.includes(v) ? T.extras.filter(x=>x!==v) : [...T.extras, v];
    else T[k] = v;
    paint();
  });
  $('#reset').onclick = () => { if (full){ T.sit='빠른 점심'; T.people='3~4'; T.price='all'; T.walk='all'; } T.cuisine='all'; T.wait='all'; T.extras=[]; paint(); };
  $('#apply').onclick = () => { Object.assign(Q, T); persistQ(); closeLayer(); render(); };
  $('#ov').onclick = e => { if (e.target.id==='ov') closeLayer(); };
  paint();
}

/* 지도 */
let map;
function drawMap(list){
  if (typeof L === 'undefined'){ $('#map').innerHTML = '<div class="empty"><p>지도를 불러오지 못했어요. 목록 탭으로 비교해 주세요.</p></div>'; return; }
  if (map){ map.remove(); map = null; }
  map = L.map('map', {zoomControl:true});
  /* 지도 배경: 키가 필요 없는 OpenStreetMap 기본 지도. 안 뜨면 OSM 인도주의(HOT) 지도로 자동 전환 */
  const OSM_ATTR = '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> 기여자';
  const TILES = [
    {url:'https://tile.openstreetmap.org/{z}/{x}/{y}.png', opt:{maxZoom:19, attribution:OSM_ATTR}},
    {url:'https://{s}.tile.openstreetmap.fr/hot/{z}/{x}/{y}.png', opt:{maxZoom:19, subdomains:'abc', attribution:OSM_ATTR + ' · 지도 스타일 <a href="https://www.hotosm.org/">HOT</a>'}}
  ];
  let ti = 0, errs = 0, loaded = false, warned = false, tl;
  const useTiles = () => {
    if (tl) map.removeLayer(tl);
    errs = 0; loaded = false;
    tl = L.tileLayer(TILES[ti].url, TILES[ti].opt).addTo(map);
    tl.on('tileload', () => { loaded = true; });
    tl.on('tileerror', () => {
      errs++;
      if (loaded || errs < 3) return;
      if (ti < TILES.length - 1){ ti++; useTiles(); return; }
      if (warned) return; warned = true;
      const n = document.createElement('div'); n.className = 'tilewarn'; n.textContent = '지도 배경을 불러오지 못했어요. 핀은 그대로 볼 수 있어요.'; $('#map').appendChild(n);
    });
  };
  useTiles();
  const a = D.anchors[Q.region]; const pts = [a];
  L.marker(a, {icon:L.divIcon({className:'', html:`<span class="office">${esc(Q.region)}</span>`}), zIndexOffset:300, keyboard:false}).addTo(map);
  list.forEach((r,i) => {
    const m = L.marker([r.lat, r.lng], {icon:L.divIcon({className:'', html:`<span class="pin ${i===0?'top':''}" data-pin="${r.id}"><b class="num">${i+1}</b><i></i></span>`}), zIndexOffset: i===0?400:0, title:r.name});
    m.on('click', () => { document.querySelectorAll('.pin').forEach(p => p.classList.toggle('on', p.dataset.pin===r.id)); mapCard(r); });
    m.addTo(map); pts.push([r.lat, r.lng]);
  });
  map.fitBounds(L.latLngBounds(pts).pad(.2), {maxZoom:17});
  if (list[0]) mapCard(list[0]);
}
function mapCard(r){
  const box = $('#mapPick'); if (!box) return;
  box.innerHTML = cardHTML(r); bindCards(box);
}

}
function confirmLeave(fn){
  dialog('<p>작성 중인 후기가 사라져요. 나갈까요?</p>', '나가기', () => { W = null; fn(); }, '계속 쓰기');
}

/* ---------- 저장 · 공유 ---------- */
function toggleSave(id){
  const k = ukey(); const cur = mySaved();
  saved[k] = cur.includes(id) ? cur.filter(x=>x!==id) : [id, ...cur];
  store.set('saved', saved);
  toast(saved[k].includes(id) ? '저장했어요' : '저장을 취소했어요');
  if (route.name==='list' && listView==='list') vList();
  if (route.name==='saved') vSaved();
  if (route.name==='list' && listView==='map'){ mapCard(byId[id]); }
}
function shareOne(r){
  const url = location.origin + location.pathname + '?r=' + r.id;
  const text = `[필드맛지도] ${r.name.replace(' 예시점','')} (${r.region})\n${r.cuisine} · 1인 ${won(r.price)} · 도보 ${r.walk}분 · ${r.maxPeople}인 함께 착석\n${url}`;
  const done = () => toast('링크를 복사했어요. 팀원에게 보내보세요.');
  try {
    navigator.clipboard.writeText(text).then(done, () => dialog(`<p>아래 내용을 복사해 팀원에게 보내주세요.</p><textarea class="ta" readonly style="min-height:120px;font-size:13px">${esc(text)}</textarea>`, '닫기'));
  } catch(e){ dialog(`<p>아래 내용을 복사해 팀원에게 보내주세요.</p><textarea class="ta" readonly style="min-height:120px;font-size:13px">${esc(text)}</textarea>`, '닫기'); }
}

/* ---------- 레이어 · 다이얼로그 · 토스트 ---------- */
function openLayer(html, keepScroll){ $('#layer').innerHTML = html; if (!keepScroll) document.body.style.overflow = 'hidden'; }
function closeLayer(){ $('#layer').innerHTML = ''; document.body.style.overflow = ''; }
function dialog(body, okLabel, onOk, cancelLabel){
  openLayer(`<div class="ov center" id="ov"><div class="dialog" role="alertdialog" aria-modal="true">${body}
    ${cancelLabel ? `<div class="two"><button class="btn2" id="dCancel">${cancelLabel}</button><button class="btn" id="dOk">${okLabel}</button></div>` : `<button class="btn" id="dOk">${okLabel}</button>`}</div></div>`);
  $('#dOk').onclick = () => { closeLayer(); if (onOk) onOk(); };
  if ($('#dCancel')) $('#dCancel').onclick = closeLayer;
  $('#ov').onclick = e => { if (e.target.id==='ov') closeLayer(); };
  const ta = document.querySelector('.dialog textarea'); if (ta){ ta.focus(); ta.select(); }
}
document.addEventListener('keydown', e => { if (e.key==='Escape') closeLayer(); });
let tt;
function toast(msg){
  let t = document.querySelector('.toast'); if (!t){ t = document.createElement('div'); t.className = 'toast'; t.setAttribute('role','status'); document.body.appendChild(t); }
  t.textContent = msg; clearTimeout(tt); tt = setTimeout(() => t.remove(), 2400);
}

/* ---------- 시작 ---------- */
const shared = new URLSearchParams(location.search).get('r');
if (shared && byId[shared]){
  try { history.replaceState(null, '', location.pathname + '#detail/' + shared); } catch(e){ location.hash = 'detail/'+shared; }
  if (!session) sessionStorageSet('pendingDetail', shared);
}
render();
})();
</script>
